name: LAB.
version: "0.3.0"
slug: lab
description: Find, open and set up your LAB. sensors from Home Assistant.
url: https://github.com/NightStinks/lab-hub
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# The sidebar panel. Device pages open through Home Assistant (Ingress), so they also work remotely.
ingress: true
ingress_port: 8749
panel_icon: mdi:radar
panel_title: LAB.
# mDNS discovery needs the host network (multicast does not cross the add-on network).
host_network: true
# Lets the add-on set device names in Home Assistant to the names given to the sensors.
homeassistant_api: true
